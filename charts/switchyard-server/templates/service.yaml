apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
  - protocol: {{ .Values.port.protocol}}
    port: {{ .Values.port.number }}
    targetPort: {{ .Values.port.number }}
    name: {{ .Values.port.name }}
