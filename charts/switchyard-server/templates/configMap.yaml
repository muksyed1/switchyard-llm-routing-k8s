apiVersion: v1
kind: ConfigMap
metadata: 
    name: "{{ .Release.Name }}-routes"
data:
    LOG_LEVEL: "DEBUG"
    routes-config: |
        schema_version = 1

        # ---------- one client + one target per model node ---------- #
        [llm_clients.demo-model-llama]
        format = "openai_chat"
        base_url = "http://demo-model-llama:11434/v1"

        [targets.demo-model-llama]
        id = "{{ .Values.model.llama }}"
        llm_client = "demo-model-llama"

        [llm_clients.demo-model-nemotron]
        format = "openai_chat"
        base_url = "http://demo-model-nemotron:11434/v1"

        [targets.demo-model-nemotron]
        id = "{{ .Values.model.nemotron }}"
        llm_client = "demo-model-nemotron"

        [llm_clients.demo-model-qwen]
        format = "openai_chat"
        base_url = "http://demo-model-qwen:11434/v1"

        [targets.demo-model-qwen]
        id = "{{ .Values.model.qwen }}"
        llm_client = "demo-model-qwen"
   
        # ---------- routes: the "model" names callers can request ---------- #
        [routes.smart]
        id = "switchyard"
        type = "auto"
        capable_target = "{{ .Values.capable_target }}"
        efficient_target = "{{ .Values.efficient_target }}"

        [routes.demo-model-llama]
        id = "demo-model-llama"
        type = "passthrough"
        target = "demo-model-llama"

        [routes.demo-model-nemotron]
        id = "demo-model-nemotron"
        type = "passthrough"
        target = "demo-model-nemotron"

        [routes.demo-model-qwen]
        id = "demo-model-qwen"
        type = "passthrough"
        target = "demo-model-qwen"
