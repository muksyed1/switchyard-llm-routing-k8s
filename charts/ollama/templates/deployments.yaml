apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.metadata.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/version: "{{ .Values.labels.version }}"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/version: "{{ .Values.labels.version }}"
    spec:
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.repository}}"
        ports:
        - name: {{ .Values.port.name }}
          containerPort: {{ .Values.port.number }}
          protocol: {{ .Values.port.protocol }}
        volumeMounts:
          - name: "{{ .Release.Name }}-vol"
            mountPath: /root/.ollama
        lifecycle:
          postStart:
            exec:
              command:
                - sh
                - -c
                - |
                  {{- if .Values.model }}
                  (
                    for i in $(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 2; done
                    if ! ollama list | awk 'NR>1{print $1}' | grep -qx '{{ .Values.model }}'; then
                      ollama pull '{{ .Values.model }}'
                    fi
                  ) > /tmp/model-pull.log 2>&1 &
                  {{- end }}
        resources:
          requests:
            memory: "{{ .Values.resources.requests.memory }}"
            cpu: "{{ .Values.resources.requests.cpu }}"
          limits:
            memory: "{{ .Values.resources.limits.memory }}"
            cpu: "{{ .Values.resources.limits.cpu }}"
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
      volumes:
      - name: "{{ .Release.Name }}-vol"
        persistentVolumeClaim:
          claimName: "{{ .Release.Name }}-vol-claim"
