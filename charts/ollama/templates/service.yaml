apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: switchyard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
  - protocol: {{ .Values.port.protocol}}
    port: {{ .Values.port.number }}
    targetPort: {{ .Values.port.number }}
